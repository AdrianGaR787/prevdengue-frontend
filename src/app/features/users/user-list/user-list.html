<mat-card class="mat-elevation-z4 m-4">
  <mat-card-header>
    <mat-card-title>Gestión de Usuarios (Administrador)</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <div class="cards-container">

      <mat-card class="user-card" *ngFor="let user of pagedUsers">

        <mat-card-header>
          <mat-card-title>{{ user.name }}</mat-card-title>

          <mat-card-subtitle
            [style.color]="user.role?.nameRole === 'ADMIN' ? '#e91e63' : '#3f51b5'">
            {{ user.role?.nameRole || 'SIN ROL' }}
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p><strong>ID:</strong> {{ user.idUser }}</p>
          <p><strong>Correo:</strong> {{ user.email }}</p>
          <p><strong>Teléfono:</strong> {{ user.phone || 'N/A' }}</p>
        </mat-card-content>

        <mat-card-actions align="end">

          <button
            mat-icon-button
            color="accent"
            [routerLink]="['/dashboard/usuarios/editar', user.idUser]">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="deleteUser(user.idUser)">
            <mat-icon>delete</mat-icon>
          </button>

        </mat-card-actions>

      </mat-card>

    </div>

    <mat-paginator
      [length]="users.length"
      [pageSize]="pageSize"
      [pageSizeOptions]="[3,6,9,12]"
      (page)="onPageChange($event)">
    </mat-paginator>

  </mat-card-content>
</mat-card>
