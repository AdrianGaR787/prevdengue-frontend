<div style="display: flex; justify-content: center; margin-top: 20px;">
  <mat-card style="width: 500px; padding: 20px;" class="mat-elevation-z4">
    <mat-card-header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px;">
    <mat-card-title>Gestión de Usuarios (Administrador)</mat-card-title>
    
    <button mat-raised-button color="primary" routerLink="/dashboard/usuarios/nuevo">
      <mat-icon>person_add</mat-icon> Nuevo Usuario
    </button>
  </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSave()" #userForm="ngForm">
        
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Nombre Completo</mat-label>
          <input matInput [(ngModel)]="user.name" name="name" required>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput type="email" [(ngModel)]="user.email" name="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Teléfono</mat-label>
          <input matInput [(ngModel)]="user.phone" name="phone">
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Rol del Usuario</mat-label>
          <mat-select [(ngModel)]="user.role.idRole" name="role" required>
            @for (rol of roles; track rol.idRole) {
              <mat-option [value]="rol.idRole">{{ rol.nameRole }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        @if (!isEditMode) {
          <mat-form-field appearance="outline" style="width: 100%;">
            <mat-label>Contraseña Provisional</mat-label>
            <input matInput type="password" [(ngModel)]="user.passwordHash" name="passwordHash" required>
          </mat-form-field>
        }

        <mat-card-actions align="end" style="padding-right: 0;">
          <button mat-button type="button" routerLink="/dashboard/usuarios">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
            Guardar Usuario
          </button>
        </mat-card-actions>

      </form>
    </mat-card-content>
  </mat-card>
</div>
