<mat-card class="mat-elevation-z4 m-4">
  <mat-card-header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px;">
    <mat-card-title>Gestión de Distritos</mat-card-title>
    <button mat-raised-button color="primary" routerLink="/dashboard/distritos/nuevo">
      <mat-icon>add</mat-icon> Nuevo Distrito
    </button>
  </mat-card-header>

  <mat-card-content>
    @if (loading) {
      <div class="loading-state">
        <mat-spinner diameter="36"></mat-spinner>
        <span>Cargando distritos...</span>
      </div>
    } @else if (dataSource.data.length === 0) {
      <div class="empty-state">
        <mat-icon>location_off</mat-icon>
        <p>Aún no hay distritos registrados.</p>
      </div>
    } @else {
    <table mat-table [dataSource]="dataSource" style="width: 100%;">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.idDistrict}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre del Distrito </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.nameDistrict}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" [routerLink]="['/dashboard/distritos/editar', element.idDistrict]" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteDistrict(element.idDistrict)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    }
  </mat-card-content>
</mat-card>
