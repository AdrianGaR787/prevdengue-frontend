<div style="display: flex; justify-content: center; margin-top: 20px;">
  <mat-card style="width: 500px; padding: 20px;" class="mat-elevation-z4">
    <mat-card-header style="margin-bottom: 20px; justify-content: center;">
      <mat-card-title>{{ isEditMode ? 'Editar Rol' : 'Nuevo Rol' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSave()" #form="ngForm">
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Nombre del Rol (Ej: ADMIN)</mat-label>
          <input matInput [(ngModel)]="role.nameRole" name="nameRole" required>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Descripción</mat-label>
          <textarea matInput [(ngModel)]="role.description" name="description" rows="3" required></textarea>
        </mat-form-field>

        <mat-card-actions align="end" style="padding-right: 0;">
          <button mat-button type="button" routerLink="/dashboard/roles">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Guardar</button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
