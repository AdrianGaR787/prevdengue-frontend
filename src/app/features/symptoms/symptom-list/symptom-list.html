<mat-card class="mat-elevation-z4 m-4">
  <mat-card-header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px;">
    <mat-card-title>Gestión de Síntomas</mat-card-title>
    <button mat-raised-button color="primary" routerLink="/dashboard/sintomas/nuevo">
      <mat-icon>add</mat-icon> Nuevo Síntoma
    </button>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" style="width: 100%;">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.idSymptom}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Síntoma </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.nameSymptom}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="gravity">
        <th mat-header-cell *matHeaderCellDef> Nivel de Gravedad </th>
        <td mat-cell *matCellDef="let element"> 
          <span [ngStyle]="{'color': element.gravitylevel >= 4 ? 'red' : (element.gravitylevel >= 2 ? 'orange' : 'green'), 'font-weight': 'bold'}">
            Nivel {{element.gravitylevel}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" [routerLink]="['/dashboard/sintomas/editar', element.idSymptom]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSymptom(element.idSymptom)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
