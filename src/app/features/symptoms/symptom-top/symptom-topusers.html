<div style="padding: 20px; max-width: 800px; margin: 0 auto;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <div>
      <h1 style="margin: 0; color: var(--primary-dark); font-weight: 700;">Analítica de Síntomas</h1>
      <p style="margin: 0; color: var(--text-muted);">Los síntomas más reportados por los ciudadanos.</p>
    </div>
    
    <button mat-button color="primary" routerLink="/dashboard/sintomas">
      <mat-icon>arrow_back</mat-icon> Volver al catálogo
    </button>
  </div>

  <mat-card class="mat-elevation-z4" style="border-radius: 16px;">
    <mat-card-header style="margin-bottom: 20px;">
      <mat-icon style="color: #60A5FA; margin-right: 10px;">coronavirus</mat-icon>
      <mat-card-title>Ranking de Frecuencia</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      @for (item of sintomasStats; track $index) {
        <div class="bar-container">
          <div class="bar-header">
            <span>{{ item.name }}</span>
            <span class="bar-count">{{ item.count }} reportes</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="background-color: #60A5FA;" [style.width.%]="item.percent"></div>
          </div>
        </div>
      } @empty {
        <p style="text-align: center; color: var(--text-muted);">
          No hay suficientes datos registrados actualmente.
        </p>
      }
    </mat-card-content>
  </mat-card>

</div>
