<mat-card class="mat-elevation-z4 m-4">
  <mat-card-header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px;">
    <mat-card-title>Gestión de Tipos de Criadero</mat-card-title>
    <button mat-raised-button color="primary" routerLink="/dashboard/criaderos/nuevo">
      <mat-icon>add</mat-icon> Nuevo Criadero
    </button>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" style="width: 100%;">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.idHatcheryType}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre del Criadero </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.nameHatchery}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" [routerLink]="['/dashboard/criaderos/editar', element.idHatcheryType]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteHatcheryType(element.idHatcheryType)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
